spring:
  config:
    import: "optional:file:./ecom-inventory-service/.env[.properties]"
  application:
    name: ecom-inventory-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8081

  

